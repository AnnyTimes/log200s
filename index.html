<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no"
>

<title>200S HID LOGGER</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
  touch-action: manipulation;
}

body {
  overflow-y: auto;
}

.app {
  padding: 18px 14px 30px;
  max-width: 600px;
  margin: 0 auto;
}

h1 {
  margin: 0 0 6px;
  text-align: center;
  font-size: 22px;
  letter-spacing: 2px;
}

.subtitle {
  text-align: center;
  color: #888;
  font-size: 13px;
  margin-bottom: 20px;
}

.status {
  padding: 12px;
  border: 1px solid #333;
  border-radius: 8px;
  background: #111;
  margin-bottom: 12px;
}

.status-title {
  color: #888;
  font-size: 12px;
  margin-bottom: 5px;
}

.status-value {
  font-size: 18px;
  font-weight: bold;
}

.last {
  padding: 16px;
  border: 1px solid #444;
  border-radius: 10px;
  background: #151515;
  margin-bottom: 12px;
}

.last-title {
  color: #888;
  font-size: 12px;
  margin-bottom: 8px;
}

.last-key {
  font-size: 42px;
  font-weight: bold;
  text-align: center;
  word-break: break-all;
  min-height: 50px;
}

.data {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 1px;
  background: #333;
  border: 1px solid #333;
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 12px;
}

.data div {
  padding: 10px;
  background: #111;
  word-break: break-all;
}

.data .label {
  color: #888;
  background: #151515;
}

.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}

button {
  flex: 1;
  height: 44px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #151515;
  color: #fff;
  font-size: 15px;
  font-weight: bold;
  touch-action: manipulation;
}

button:active {
  transform: scale(.97);
}

.log-title {
  color: #888;
  font-size: 12px;
  margin-bottom: 6px;
}

.log {
  border: 1px solid #333;
  border-radius: 8px;
  overflow: hidden;
}

.log-row {
  display: grid;
  grid-template-columns: 45px 1fr 1fr 1fr;
  border-bottom: 1px solid #222;
}

.log-row:last-child {
  border-bottom: 0;
}

.log-row div {
  padding: 9px 6px;
  background: #0f0f0f;
  font-size: 13px;
  word-break: break-all;
}

.log-header div {
  background: #191919;
  color: #888;
  font-size: 11px;
}

.empty {
  padding: 20px;
  text-align: center;
  color: #666;
  background: #0f0f0f;
}
</style>
</head>

<body>

<div class="app">

  <h1>200S HID LOGGER</h1>

  <div class="subtitle">
    200Sのキーボード入力を記録します
  </div>

  <div class="status">
    <div class="status-title">STATUS</div>
    <div id="status" class="status-value">
      待機中
    </div>
  </div>

  <div class="last">

    <div class="last-title">
      LAST INPUT
    </div>

    <div id="lastKey" class="last-key">
      —
    </div>

  </div>

  <div class="data">

    <div class="label">event.key</div>
    <div id="key">—</div>

    <div class="label">event.code</div>
    <div id="code">—</div>

    <div class="label">keyCode</div>
    <div id="keyCode">—</div>

    <div class="label">which</div>
    <div id="which">—</div>

    <div class="label">location</div>
    <div id="location">—</div>

    <div class="label">repeat</div>
    <div id="repeat">—</div>

  </div>

  <div class="controls">

    <button id="clearLog">
      LOG CLEAR
    </button>

    <button id="clearLast">
      LAST CLEAR
    </button>

  </div>

  <div class="log-title">
    RECEIVED INPUT LOG
  </div>

  <div class="log">

    <div class="log-row log-header">
      <div>#</div>
      <div>key</div>
      <div>code</div>
      <div>keyCode</div>
    </div>

    <div id="logBody">
      <div class="empty">
        まだ入力はありません
      </div>
    </div>

  </div>

</div>

<script>

let count = 0;

const statusElement =
  document.getElementById("status");

const lastKeyElement =
  document.getElementById("lastKey");

const keyElement =
  document.getElementById("key");

const codeElement =
  document.getElementById("code");

const keyCodeElement =
  document.getElementById("keyCode");

const whichElement =
  document.getElementById("which");

const locationElement =
  document.getElementById("location");

const repeatElement =
  document.getElementById("repeat");

const logBody =
  document.getElementById("logBody");


/*
 * キーボード入力を監視
 */
document.addEventListener("keydown", function(event) {

  count++;

  statusElement.textContent =
    "INPUT RECEIVED";

  lastKeyElement.textContent =
    event.key === " "
      ? "[SPACE]"
      : event.key;

  keyElement.textContent =
    event.key;

  codeElement.textContent =
    event.code;

  keyCodeElement.textContent =
    event.keyCode;

  whichElement.textContent =
    event.which;

  locationElement.textContent =
    event.location;

  repeatElement.textContent =
    event.repeat;


  /*
   * ログに追加
   */
  const empty =
    logBody.querySelector(".empty");

  if (empty) {
    empty.remove();
  }

  const row =
    document.createElement("div");

  row.className = "log-row";

  row.innerHTML = `
    <div>${count}</div>
    <div>${escapeHtml(event.key)}</div>
    <div>${escapeHtml(event.code)}</div>
    <div>${event.keyCode}</div>
  `;

  logBody.prepend(row);

});


/*
 * LOG CLEAR
 */
document
  .getElementById("clearLog")
  .addEventListener("click", function() {

    count = 0;

    logBody.innerHTML = `
      <div class="empty">
        まだ入力はありません
      </div>
    `;

    statusElement.textContent =
      "待機中";
  });


/*
 * LAST CLEAR
 */
document
  .getElementById("clearLast")
  .addEventListener("click", function() {

    lastKeyElement.textContent = "—";

    keyElement.textContent = "—";
    codeElement.textContent = "—";
    keyCodeElement.textContent = "—";
    whichElement.textContent = "—";
    locationElement.textContent = "—";
    repeatElement.textContent = "—";

    statusElement.textContent =
      "待機中";
  });


/*
 * HTMLエスケープ
 */
function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
