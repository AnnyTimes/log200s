<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>200S HID MAPPER</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
  touch-action: manipulation;
}

body {
  overflow-y: auto;
}

.app {
  max-width: 600px;
  margin: 0 auto;
  padding: 18px 14px 30px;
}

h1 {
  margin: 0 0 5px;
  text-align: center;
  font-size: 22px;
  letter-spacing: 2px;
}

.subtitle {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin-bottom: 18px;
}

.target-box {
  border: 2px solid #333;
  border-radius: 12px;
  background: #111;
  padding: 18px 12px;
  text-align: center;
  margin-bottom: 12px;
}

.target-label {
  color: #888;
  font-size: 12px;
  margin-bottom: 7px;
  letter-spacing: 1px;
}

.target {
  font-size: 32px;
  font-weight: bold;
  min-height: 40px;
}

.progress {
  margin-top: 9px;
  color: #777;
  font-size: 13px;
}

.last-box {
  border: 1px solid #333;
  border-radius: 10px;
  background: #111;
  padding: 12px;
  margin-bottom: 12px;
}

.last-label {
  color: #777;
  font-size: 11px;
  margin-bottom: 5px;
}

.last-value {
  font-size: 20px;
  font-weight: bold;
  word-break: break-word;
}

.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

button {
  flex: 1;
  height: 46px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #151515;
  color: #fff;
  font-size: 14px;
  font-weight: bold;
  touch-action: manipulation;
}

button:active {
  transform: scale(.97);
}

.undo {
  border-color: #744;
}

.csv {
  border-color: #447;
}

.reset {
  border-color: #555;
}

.detail {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 1px;
  background: #333;
  border: 1px solid #333;
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 15px;
}

.detail div {
  padding: 9px;
  background: #111;
  word-break: break-all;
  font-size: 13px;
}

.detail .label {
  color: #888;
  background: #151515;
}

.list-title {
  color: #888;
  font-size: 12px;
  margin-bottom: 6px;
}

.list {
  border: 1px solid #333;
  border-radius: 8px;
  overflow: hidden;
}

.row {
  display: grid;
  grid-template-columns: 35px 1.3fr 1.2fr 1fr;
  border-bottom: 1px solid #222;
}

.row:last-child {
  border-bottom: 0;
}

.row div {
  padding: 8px 5px;
  background: #0f0f0f;
  font-size: 12px;
  word-break: break-all;
}

.header div {
  background: #191919;
  color: #888;
  font-size: 10px;
}

.pending {
  color: #555;
}

.complete {
  border-color: #396;
  background: #102016;
}

.complete .target {
  color: #6f9;
}

@media (max-width: 400px) {
  .target {
    font-size: 28px;
  }

  .row div {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div class="app">

  <h1>200S HID MAPPER</h1>

  <div class="subtitle">
    200Sの実機入力を1投単位で記録します
  </div>

  <div id="targetBox" class="target-box">

    <div class="target-label">
      NEXT TARGET
    </div>

    <div id="target" class="target">
      読み込み中
    </div>

    <div id="progress" class="progress">
      0 / 82
    </div>

  </div>

  <div class="last-box">

    <div class="last-label">
      LAST THROW
    </div>

    <div id="lastValue" class="last-value">
      —
    </div>

  </div>

  <div class="controls">

    <button id="undo" class="undo">
      1つ戻す
    </button>

    <button id="csv" class="csv">
      CSV出力
    </button>

    <button id="reset" class="reset">
      最初から
    </button>

  </div>

  <div class="detail">

    <div class="label">INPUTS</div>
    <div id="inputs">—</div>

    <div class="label">KEYS</div>
    <div id="keys">—</div>

    <div class="label">CODES</div>
    <div id="codes">—</div>

    <div class="label">KEYCODES</div>
    <div id="keyCodes">—</div>

  </div>

  <div class="list-title">
    MAPPING
  </div>

  <div class="list">

    <div class="row header">
      <div>#</div>
      <div>TARGET</div>
      <div>KEY</div>
      <div>CODE</div>
    </div>

    <div id="listBody"></div>

  </div>

</div>

<script>

/*
 * ==========================================
 * 200S HID MAPPER
 * ==========================================
 *
 * 1投で複数のkeydownが発生する場合があるため、
 * 短時間に連続して届いたkeydownを
 * 「1投分の入力セット」としてまとめる。
 *
 * 例：
 *
 * Shift
 * W
 *
 * ↓
 *
 * 1W = Shift + W
 */


/*
 * 1投の入力をまとめる待ち時間
 *
 * 200ms以内に次の入力が来たら
 * 同じ投球として扱う。
 */

const GROUP_DELAY = 200;


/*
 * 測定順
 *
 * 20数字 × 4種類
 * + Bull 2種類
 *
 * 合計82
 */

const targets = [];

for (let number = 1; number <= 20; number++) {

  targets.push({
    label: `${number} 外シングル`,
    number: number,
    area: "Outer Single"
  });

  targets.push({
    label: `${number} 内シングル`,
    number: number,
    area: "Inner Single"
  });

  targets.push({
    label: `${number} ダブル`,
    number: number,
    area: "Double"
  });

  targets.push({
    label: `${number} トリプル`,
    number: number,
    area: "Triple"
  });
}

targets.push({
  label: "Bull 外側",
  number: "Bull",
  area: "Outer Bull"
});

targets.push({
  label: "Bull 内側",
  number: "Bull",
  area: "Inner Bull"
});


/*
 * 状態
 */

let currentIndex = 0;

let results = [];


/*
 * 現在の投球で受信中の入力
 */

let pendingInputs = [];

let groupTimer = null;


/*
 * 保存
 */

const STORAGE_KEY =
  "darts_200s_hid_mapping_v2";


/*
 * DOM
 */

const targetElement =
  document.getElementById("target");

const progressElement =
  document.getElementById("progress");

const targetBox =
  document.getElementById("targetBox");

const lastValueElement =
  document.getElementById("lastValue");

const inputsElement =
  document.getElementById("inputs");

const keysElement =
  document.getElementById("keys");

const codesElement =
  document.getElementById("codes");

const keyCodesElement =
  document.getElementById("keyCodes");

const listBody =
  document.getElementById("listBody");


/*
 * ==========================================
 * 保存
 * ==========================================
 */

function saveData() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({
      currentIndex,
      results
    })
  );
}


function loadData() {

  const saved =
    localStorage.getItem(STORAGE_KEY);

  if (!saved) {
    return;
  }

  try {

    const data =
      JSON.parse(saved);

    if (
      Array.isArray(data.results) &&
      typeof data.currentIndex === "number"
    ) {

      results =
        data.results;

      currentIndex =
        data.currentIndex;

    }

  } catch (error) {

    console.log(
      "保存データを読み込めませんでした",
      error
    );
  }
}


/*
 * ==========================================
 * 画面更新
 * ==========================================
 */

function render() {

  if (currentIndex >= targets.length) {

    targetElement.textContent =
      "測定完了";

    progressElement.textContent =
      `${targets.length} / ${targets.length}`;

    targetBox.classList.add("complete");

  } else {

    targetElement.textContent =
      targets[currentIndex].label;

    progressElement.textContent =
      `${currentIndex} / ${targets.length}`;

    targetBox.classList.remove("complete");
  }


  /*
   * MAPPING
   */

  listBody.innerHTML = "";

  for (
    let i = 0;
    i < targets.length;
    i++
  ) {

    const target =
      targets[i];

    const result =
      results[i];

    const row =
      document.createElement("div");

    row.className =
      "row";


    const number =
      document.createElement("div");

    number.textContent =
      i + 1;


    const targetCell =
      document.createElement("div");

    targetCell.textContent =
      target.label;


    const keyCell =
      document.createElement("div");

    const codeCell =
      document.createElement("div");


    if (result) {

      keyCell.textContent =
        result.keys.join(" + ");

      codeCell.textContent =
        result.codes.join(" + ");

    } else {

      keyCell.textContent =
        "—";

      codeCell.textContent =
        "—";

      keyCell.className =
        "pending";

      codeCell.className =
        "pending";
    }


    row.appendChild(number);
    row.appendChild(targetCell);
    row.appendChild(keyCell);
    row.appendChild(codeCell);

    listBody.appendChild(row);
  }
}


/*
 * ==========================================
 * 1投分の入力を確定
 * ==========================================
 */

function finalizeThrow() {

  if (
    pendingInputs.length === 0
  ) {
    return;
  }


  if (
    currentIndex >= targets.length
  ) {
    pendingInputs = [];
    return;
  }


  const target =
    targets[currentIndex];


  /*
   * 1投分として保存
   */

  results[currentIndex] = {

    target:
      target.label,

    number:
      target.number,

    area:
      target.area,

    inputs:
      pendingInputs.map(input => ({
        key: input.key,
        code: input.code,
        keyCode: input.keyCode,
        which: input.which,
        location: input.location,
        repeat: input.repeat
      })),

    keys:
      pendingInputs.map(
        input => input.key
      ),

    codes:
      pendingInputs.map(
        input => input.code
      ),

    keyCodes:
      pendingInputs.map(
        input => input.keyCode
      )
  };


  /*
   * 表示
   */

  lastValueElement.textContent =
    `${target.label} → ` +
    pendingInputs
      .map(input => input.key)
      .join(" + ");


  inputsElement.textContent =
    pendingInputs.length;

  keysElement.textContent =
    pendingInputs
      .map(input => input.key)
      .join(" + ");

  codesElement.textContent =
    pendingInputs
      .map(input => input.code)
      .join(" + ");

  keyCodesElement.textContent =
    pendingInputs
      .map(input => input.keyCode)
      .join(" + ");


  /*
   * 次のターゲットへ
   */

  currentIndex++;

  pendingInputs = [];


  /*
   * 保存
   */

  saveData();

  render();
}


/*
 * ==========================================
 * キーボード入力
 * ==========================================
 */

document.addEventListener(
  "keydown",
  function(event) {

    /*
     * 測定完了後は無視
     */

    if (
      currentIndex >= targets.length
    ) {
      return;
    }


    /*
     * 受信した入力を一旦保留
     */

    pendingInputs.push({

      key:
        event.key,

      code:
        event.code,

      keyCode:
        event.keyCode,

      which:
        event.which,

      location:
        event.location,

      repeat:
        event.repeat

    });


    /*
     * 前のタイマーを解除
     */

    clearTimeout(groupTimer);


    /*
     * 200ms入力が来なければ
     * 1投として確定
     */

    groupTimer =
      setTimeout(
        finalizeThrow,
        GROUP_DELAY
      );

  },
  false
);


/*
 * ==========================================
 * 1つ戻す
 * ==========================================
 */

document
  .getElementById("undo")
  .addEventListener(
    "click",
    function() {

      /*
       * まだ入力をまとめている途中なら
       * まずそれを破棄
       */

      if (
        pendingInputs.length > 0
      ) {

        clearTimeout(groupTimer);

        pendingInputs = [];

        return;
      }


      /*
       * 最初なら何もしない
       */

      if (currentIndex <= 0) {
        return;
      }


      /*
       * 直前の投球を削除
       */

      currentIndex--;

      results.splice(
        currentIndex,
        1
      );


      /*
       * 直前の結果を表示
       */

      if (currentIndex > 0) {

        const previous =
          results[currentIndex - 1];

        if (previous) {

          lastValueElement.textContent =
            `${previous.target} → ` +
            previous.keys.join(" + ");

          inputsElement.textContent =
            previous.inputs.length;

          keysElement.textContent =
            previous.keys.join(" + ");

          codesElement.textContent =
            previous.codes.join(" + ");

          keyCodesElement.textContent =
            previous.keyCodes.join(" + ");
        }

      } else {

        lastValueElement.textContent =
          "—";

        inputsElement.textContent =
          "—";

        keysElement.textContent =
          "—";

        codesElement.textContent =
          "—";

        keyCodesElement.textContent =
          "—";
      }


      saveData();

      render();

    }
  );


/*
 * ==========================================
 * CSV出力
 * ==========================================
 */

document
  .getElementById("csv")
  .addEventListener(
    "click",
    function() {

      const header = [

        "No",
        "Target",
        "Number",
        "Area",
        "Input Count",
        "Keys",
        "Codes",
        "KeyCodes"

      ];


      const lines = [];

      lines.push(
        header.join(",")
      );


      for (
        let i = 0;
        i < targets.length;
        i++
      ) {

        const target =
          targets[i];

        const result =
          results[i];


        const row = [

          i + 1,

          target.label,

          target.number,

          target.area,

          result
            ? result.inputs.length
            : "",

          result
            ? result.keys.join(" + ")
            : "",

          result
            ? result.codes.join(" + ")
            : "",

          result
            ? result.keyCodes.join(" + ")
            : ""

        ];


        lines.push(
          row
            .map(csvEscape)
            .join(",")
        );
      }


      const csv =
        "\uFEFF" +
        lines.join("\n");


      const blob =
        new Blob(
          [csv],
          {
            type:
              "text/csv;charset=utf-8;"
          }
        );


      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement("a");

      link.href =
        url;

      link.download =
        "200S-HID-mapping.csv";

      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);

      URL.revokeObjectURL(url);
    }
  );


function csvEscape(value) {

  const text =
    String(value ?? "");

  return `"${text.replace(/"/g, '""')}"`;
}


/*
 * ==========================================
 * 最初から
 * ==========================================
 */

document
  .getElementById("reset")
  .addEventListener(
    "click",
    function() {

      const ok =
        confirm(
          "測定結果をすべて消して、最初からやり直しますか？"
        );

      if (!ok) {
        return;
      }


      clearTimeout(groupTimer);

      pendingInputs = [];

      currentIndex = 0;

      results = [];


      localStorage.removeItem(
        STORAGE_KEY
      );


      lastValueElement.textContent =
        "—";

      inputsElement.textContent =
        "—";

      keysElement.textContent =
        "—";

      codesElement.textContent =
        "—";

      keyCodesElement.textContent =
        "—";


      render();

    }
  );


/*
 * ==========================================
 * 起動
 * ==========================================
 */

loadData();

render();

</script>

</body>
</html>
